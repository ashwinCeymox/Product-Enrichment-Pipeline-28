server {
    listen 80;
    server_name localhost;

    # Use Docker's internal DNS resolver to prevent IP caching on container restart
    resolver 127.0.0.11 valid=5s;

    # Support subfolder routing by rewriting /productpipeline/ requests to the root
    location /productpipeline/ {
        rewrite ^/productpipeline/(.*)$ /$1 last;
    }

    # Serve the React frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api requests to the Uvicorn backend
    location ~ ^/api/(.*)$ {
        set $backend "http://api:8000";
        proxy_pass $backend/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /output requests to the Uvicorn backend (for images)
    location ~ ^/output/(.*)$ {
        set $backend "http://api:8000";
        proxy_pass $backend/output/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
